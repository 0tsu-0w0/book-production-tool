# Windows での確認：テスト、開発版とインストーラーのアプリでの起動と書き出し、PDF/X-1a の検査。
# 結果（PDF・画面・インストーラー）は、この実行の Artifacts からダウンロードできる。
# GitHub でリリースを公開したときは、そのタグで作ったインストーラーをリリースにも付ける（#13）。
name: windows

on:
  push:
    branches: ["**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "このタグで作り、そのリリースにインストーラーを付ける（空なら付けない）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 署名の証明書は使わない（インストーラーは署名なし。#6）。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係を入れる
        run: npm ci

      - name: テスト
        run: npm test

      - name: Windows のフォントを調べる
        run: node scripts/ci-fonts.mjs | tee ci-fonts.txt

      - name: 確認用の文書を作る
        run: node scripts/ci-sample.mjs ci

      - name: 開発版で起動して、PDF と画像を書き出す
        run: |
          npx electron . --snapshot=ci/dev-vertical --doc=ci/vertical.kolo --export-pdf=ci/dev-vertical.pdf --export-images=ci/dev-vertical-images
          npx electron . --snapshot=ci/dev-horizontal --doc=ci/horizontal.kolo --export-pdf=ci/dev-horizontal.pdf

      - name: インストーラーを作る
        run: npm run dist:win

      - name: 作ったアプリで起動して、PDF を書き出す
        run: |
          ls release
          ./release/win-unpacked/Kolophon.exe --snapshot=ci/app-vertical --doc=ci/vertical.kolo --export-pdf=ci/app-vertical.pdf

      - name: PDF/X-1a の検査
        run: node scripts/ci-check-pdf.mjs ci/dev-vertical.pdf ci/dev-horizontal.pdf ci/app-vertical.pdf

      - name: リリースにインストーラーを付ける
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" release/Kolophon-setup-*.exe --clobber --repo "$GITHUB_REPOSITORY"

      - name: 結果を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: |
            ci/
            ci-fonts.txt
            release/*.exe
          retention-days: 14
